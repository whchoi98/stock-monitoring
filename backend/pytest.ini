[pytest]
asyncio_mode = auto
testpaths = tests
# 스위트 전체가 오프라인 페이크로 5초 안에 끝난다 - 60초를 넘긴 테스트는 느린 게 아니라 매달린 것이다.
# permit 누수·데드락 회귀(팔로워가 죽은 선점자를 영원히 기다리는 등)를 무한 대기가 아니라 실패로
# 드러내기 위한 안전망이며, 각 테스트의 자체 데드라인(`asyncio.wait_for`)이 1차 방어다.
# The whole suite finishes in under 5s against offline fakes, so a test past 60s is hung, not slow. This is
# the backstop that turns a permit-leak or deadlock regression (a follower waiting forever on a dead leader)
# into a failure instead of an indefinite hang; each test's own `asyncio.wait_for` deadline comes first.
timeout = 60
