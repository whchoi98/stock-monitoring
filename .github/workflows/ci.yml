# CI — 백엔드 pytest + 프론트엔드 타입체크·린트·테스트.
# Dockerfile과 `build:deploy`는 빌드 속도 때문에 `tsc -b`를 생략하므로 타입 검사는 여기가 유일한 게이트다.
# 백엔드 스위트는 오프라인 페이크(moto)만 쓰므로 AWS 자격증명이 없어도 돈다.
#
# CI: backend pytest + frontend type-check, lint and tests.
# The Dockerfile and `build:deploy` skip `tsc -b` for build speed, so this is the only type-check gate.
# The backend suite runs against offline fakes (moto) and needs no AWS credentials.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend · pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  frontend:
    name: frontend · tsc · oxlint · vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npx vitest run
